name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  # The gate must judge pull requests too. Without this a Dependabot PR arrives
  # with no CI signal at all, which is how this fleet reached 1,461 open PRs.
  pull_request:
    branches: [main]
  # Required by the post-merge deploy dispatch below. A merge made with
  # GITHUB_TOKEN raises no push event, so without this trigger an auto-merged
  # bump lands on main and the live site keeps serving the previous build.
  workflow_dispatch:

permissions:
  contents: read

# NOT a bare `pages`: with cancel-in-progress a pull-request run would cancel a
# live deploy of main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Run 32296685908 elsewhere in this fleet hung on the Playwright install for
    # 24 minutes and Actions would have let it sit for six hours.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 22, not 20. Vite 8 declares ^20.19.0 || >=22.12.0, so a bare "20"
          # only works while setup-node happens to resolve the latest 20.x.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The WHOLE suite gates the deploy, not just the browser half. A 2026-08-14
      # sweep found 29 repos whose deploy job ran test:a11y alone, so their
      # correctness suites never blocked a publish.
      - name: Unit tests, including the 122 EIP-4844 KAT vectors
        run: npm test

      - name: Build
        run: npm run build

      # Cache the browser binaries: a cold install pulls ~170 MB every run.
      # Keyed on the lockfile, so a Playwright bump invalidates it and nothing
      # else does.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # NOT `--with-deps`. That flag is the only thing in this job that touches
      # apt, and it is what wedged 547 CI runs across this fleet: apt blocking on
      # the dpkg lock behind the runner's unattended-upgrades. The ubuntu-latest
      # image already ships the system libraries Chromium needs -- and the next
      # step proves that per run rather than assuming it, so if an image ever
      # stops shipping them the failure is one clear line instead of a timeout.
      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Verify the browser launches
        run: |
          node -e "
          require('playwright-core').chromium.launch()
            .then(b => b.close())
            .then(() => console.log('chromium launches'))
            .catch(e => {
              console.error('Chromium will not launch. The runner image is missing system libraries;');
              console.error('re-add --with-deps to the install step above, or pin a container image.');
              console.error(e.message);
              process.exit(1);
            });
          "

      - name: Accessibility gate (axe-core, WCAG 2.1 A/AA)
        run: npm run test:a11y

      - name: Claims suite (does the page tell the truth)
        run: npm run test:claims

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    # NOT `== 'push'`. That form also skips workflow_dispatch, which is the one
    # trigger the post-merge deploy below depends on: the dispatched run would
    # build, pass the whole gate, and then skip this job, so the site would
    # still never update.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. `needs: build` is the whole safety argument -- a bump can
  # only merge itself once this lab's own unit tests, build, WCAG gate and claims
  # suite have gone green on the PR. The gate decides, not the version number, so
  # a major that actually breaks this lab fails and the PR stays open for a human.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required for the deploy dispatch below. A job-level
      # permissions block REPLACES the default scopes rather than adding to
      # them, so without this `gh workflow run` returns HTTP 403 "Resource not
      # accessible by integration", the merged bump never deploys, and a
      # `|| echo` fallback hides it.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              exit 0
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          echo "::warning::gate passed but the merge did not land after 3 attempts;"
          echo "::warning::leaving this PR open - Dependabot will rebase and retry."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
      # them so workflows cannot retrigger themselves -- so deploy would never run
      # and the site would keep serving the previous build, with no red run
      # anywhere to say so. Ask for it explicitly; a workflow_dispatch through
      # the API is not suppressed. The dispatched run is the same
      # gate-then-deploy pipeline, so a bad merge still ships nothing.
      - name: Deploy the merged result
        if: success()
        run: |
          if gh pr view "$PR_URL" --json state --jq .state | grep -q MERGED; then
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
              || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
